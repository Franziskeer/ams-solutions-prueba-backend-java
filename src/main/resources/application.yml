spring:
  application:
    name: similar-products
  threads:
    virtual:
      enabled: true

server:
  port: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

mocks:
  base-url: http://localhost:3001
  connect-timeout: 500ms
  read-timeout: 2s
  http-read-timeout: 60s
  cache-ttl: 1m
  cache-max-size: 1000
